- id: automated_challenge_suite_v7
  question: Which proposed automated controls improve deployability, and where do the frozen feature and proposal definitions
    fail under intervention, falsification, and simulator transfer?
  design: Run twelve prespecified exact-truth families with six seeds per condition, correct weak-neighbor recovery by one-to-one
    identity assignment, use label-free nulls where required, and preserve separate tables for every hypothesis.
  status: complete_computational_mixed_result
  finding: Movie-wise robust null normalization improved mean F1 from 0.505 to 0.523; OOD signatures separated the deliberately
    shifted challenges with AUC 1.0; and a second simulator passed the F1 gate. Conversely, BH stopping produced F1 0.299,
    suppression variants were equivalent, weak-neighbor 80-percent recovery required amplitude ratio 1.0 at 3 to 7 px, colored
    noise reduced top-eight recall from 0.833 to 0.708, stability F1 ranged from 0 to 0.5, and reversed-time kinetic AUC remained
    0.731.
  limitation: Several challenges are intentionally stylized and OOD separation is likely optimistic; the second simulator
    is easier than the primary; suppression is tested only after local-max proposal formation; six seeds limit precision of
    severity boundaries.
  artifacts:
  - ../../docs/research/SPON_CA_BURST_AUTOMATED_CHALLENGE_SUITE_V7_RESULTS.md
  - ../../Outputs/NeuronIdentifiability/automated_challenge_suite_v7/summary.json
  - ../../Outputs/NeuronIdentifiability/automated_challenge_suite_v7/weak_neighbor_frontier.tsv
  - ../../Outputs/NeuronIdentifiability/automated_challenge_suite_v7/negative_controls.tsv
  evidence_capsule: ../../research/evidence/NREV-EXP-0013.json
  next_decision: Preserve robust null normalization as a candidate improvement, reject current BH stopping and post-proposal
    suppression as solved components, make identity-aware close-source resolution and parameter-robust stopping the next automated
    development targets, and redesign kinetic falsification around directional kernels.
- id: targeted_automated_development_v8
  question: Do parameter-consensus stopping, pre-proposal NMF separation, or an explicitly directional kinetic contrast repair
    the three principal v7 failures?
  design: Calibrate a robust score threshold on zero-source development families and compare single-window with three-window
    persistence on new artifacts; compare frozen spatial proposals with rank-two NMF under close unequal sources using one-to-one
    identities; compare the current kinetic score with forward-minus-reverse contrast on forward and reversed movies.
  status: complete_computational_negative_result
  finding: Consensus and single-window stopping were identical at F1 0.568 and radius sensitivity 0.0417. Rank-two NMF reduced
    weak-identity recovery from 0.354 to 0.069 and mean F1 from 0.580 to 0.354. Directional contrast reduced reversed AUC
    to 0.523 but also reduced forward AUC to 0.477, failing useful directionality. Only one of five gates passed.
  limitation: Consensus is tested after spatial scoring rather than during source formation; NMF rank is fixed to the true
    two-source challenge and remains unconstrained by calcium kinetics; directional contrast uses maximum correlations and
    may cancel heterogeneous source asymmetries.
  artifacts:
  - ../../docs/research/SPON_CA_BURST_TARGETED_AUTOMATED_DEVELOPMENT_V8_RESULTS.md
  - ../../Outputs/NeuronIdentifiability/targeted_automated_development_v8/summary.json
  - ../../Outputs/NeuronIdentifiability/targeted_automated_development_v8/parameter_consensus_stopping.tsv
  - ../../Outputs/NeuronIdentifiability/targeted_automated_development_v8/close_source_separation.tsv
  - ../../Outputs/NeuronIdentifiability/targeted_automated_development_v8/directional_kinetics.tsv
  evidence_capsule: ../../research/evidence/NREV-EXP-0014.json
  next_decision: Retain single-window robust stopping; reject unconstrained NMF and simple directional subtraction; pursue
    joint spatial-temporal generative deblending and source-specific kinetic likelihood ratios only with new development conditions.
- id: joint_generative_deblending_v10
  question: Can a constrained alternating spatial-temporal generative model and source-specific kinetic likelihoods repair
    the close-source and directionality failures without tuning on locked v8 conditions?
  design: Freeze a two-component model with localized smooth nonnegative footprints, sparse calcium-kernel temporal projection,
    and alternating reconstruction on new ellipse conditions; evaluate once on the locked v8 crescent grid; audit directionality
    on unconstrained component coefficients to avoid forward-kernel circularity.
  status: complete_computational_negative_result
  finding: On development conditions, generative weak recovery was 0.389 versus 0.407 spatial and F1 was 0.639 versus 0.648.
    On locked v8, weak recovery was 0.313 versus 0.521 and F1 was 0.608 versus 0.635. Corrected source-specific direction
    AUC was 0.367, with 91.7 percent of reversed components still assigned positive forward likelihood. Only one of six gates
    passed.
  limitation: Component count remains fixed at two; spatial initialization begins from the same context map; the simplified
    alternating optimizer lacks background and explicit motion components; simulated kinetics are heterogeneous enough that
    the tested likelihood is not identifiable.
  artifacts:
  - ../../docs/research/SPON_CA_BURST_JOINT_GENERATIVE_DEBLENDING_V10_RESULTS.md
  - ../../Outputs/NeuronIdentifiability/joint_generative_deblending_v10/summary.json
  - ../../Outputs/NeuronIdentifiability/joint_generative_deblending_v10/development_deblending.tsv
  - ../../Outputs/NeuronIdentifiability/joint_generative_deblending_v10/locked_v8_deblending.tsv
  - ../../Outputs/NeuronIdentifiability/joint_generative_deblending_v10/source_specific_kinetics.tsv
  evidence_capsule: ../../research/evidence/NREV-EXP-0015.json
  next_decision: Reject this constrained factorization and likelihood model; stop escalating simulator-only deblenders until
    bounded biological identity truth is available, and retain spatial context plus robust stopping as the current automated
    baseline.
- id: new_candidate_review_v1
  question: Which previously unmatched detector sites appear neuronal under blinded six-panel full-trace review, and did the
    feature-derived priority score rank neuron likelihood?
  design: Present all 18 unmatched consolidated sites in a deterministic blinded order; preserve exact centers and complete
    traces; normalize one expert's verbatim calls conservatively while retaining size, morphology, SNR, artifact, and overlap
    observations separately.
  status: complete_provisional_single_reviewer
  finding: Nine sites were definite, four probable, four uncertain, and one artifact-or-noise; 13 of 18 were provisionally
    likely neurons. The review-priority score enriched difficult ambiguous cases but did not monotonically rank neuron likelihood.
  limitation: One reviewer, selected candidates rather than exhaustive bounded-field sampling, no adjudication, and no biological
    identity or precision claim.
  artifacts:
  - ../../Outputs/NeuronIdentifiability/new_candidate_roi_review_batch_v1/user_review_v1.tsv
