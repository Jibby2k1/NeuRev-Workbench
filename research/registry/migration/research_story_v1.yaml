  next_decision: Obtain a second blinded review, adjudicate the four uncertain sites and identity-confounded observations,
    then separate review-value prioritization from calibrated neuron-likelihood modeling.
- id: external_blinded_bounded_review_v2
  question: Can an external team independently enumerate sources and review processed candidates without exposure to current
    labels, detector ranks, or site identities?
  design: 'Build two separately distributed portable browser archives: four Raw-first bounded-field clips with click annotation
    and locked coverage export, followed only after submission by 18 re-randomized and re-blinded six-panel candidates; retain
    the scoring key and agreement tools in a private archive.'
  status: complete_implementation_human_gated
  finding: All 22 videos decode, three archives pass integrity checks, public scans find no private text or path leakage,
