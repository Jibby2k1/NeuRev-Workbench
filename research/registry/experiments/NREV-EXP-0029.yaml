title: Frozen-JEPA Conditional-Background Residual Screen V1 with v1.1 domain amendment
question: Can a full-time spatially blind pixel decoder on the frozen Screen-B JEPA suppress predictable background while
  retaining exact injected calcium sources and improving paired recovery over the identical HC endpoint on raw video?
objective: Run a bounded one-seed engineering screen of normalized signed video-minus-conditional-prediction residuals with
  exact target isolation, source-off-only calibration, paired signal-retention accounting, and no scientific promotion.
rationale: The direct JEPA latent-temporal-change head was weak, but that endpoint does not test whether the frozen representation
  can predict structured background; a pixel-space residual screen can test this narrower mechanism while measuring signal
  absorption explicitly. Run A failed closed before residual interpretation because v1 applied normalization to a parent
  raw-HC endpoint defined in native units; v1.1 corrected only that domain mismatch in a fresh run without relaxing the anchor.
  Run B completed the bounded engineering screen and retained injected amplitude, but its JEPA-residual recall point estimate
  was below native raw HC while background RMS, dynamic-MAD, and tiling-seam ratios exceeded one. This technically valid
  screen is recorded for design triage only; it does not resolve a formal scientific benefit gate or change the experiment's
  draft, not-evaluated, evidence-tier-none state. Frozen integrity-checked post-screen diagnostic artifacts subsequently showed that JEPA source-on
  misses divide almost evenly between a competition-consistent intervention-recovered/source-on-missed pattern and a both-maps-missed category, unlike
  the predominantly competition-consistent raw and random-residual misses, and that a source-off-only no-amplification
  guardrail audit admits none of the 24 method-by-window residual decisions. These operational categories do not identify
  competitor biology or prove attenuation. Rank F records complete frozen-input, numerical-dependency, and execution provenance,
  including explicit start-to-end and phase durations plus the SciPy runtime version;
  safety v1.1 remains a derived policy artifact rather than a registered run. These audits strengthen the hold on this implementation
  without becoming preregistered gates or scientific evidence.
lifecycle: draft
