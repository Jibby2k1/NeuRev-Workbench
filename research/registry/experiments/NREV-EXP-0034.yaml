title: Gamma-LS protected, operational, independent, and timing campaign
question: What is the smallest supported causal proposal architecture after protected representation, support, conditioning,
  controls, audit, and exact-service tests?
objective: What is the smallest supported causal proposal architecture after protected representation, support,
  conditioning, controls, audit, and exact-service tests?
