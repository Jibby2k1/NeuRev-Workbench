design:
  summary: Evaluate coordinate-free support selection, protected paired representation and conditioning controls,
    exact-truth simulations, a fixed replay, a full-record proposal ledger, an independent frozen readout, and two
    matched 60-second paced timing trials.
  protocol_path: docs/research/SPON_CA_BURST_GAMMA_LS_PAPER_SUCCESS_CAMPAIGN_2026_09_08.md
  results_path: docs/research/SPON_CA_BURST_GAMMA_LS_PAPER_SUCCESS_RESULTS_2026_09_09.md
  unit_of_analysis: Protected occurrences clustered by identity; independent occurrences within complete one-second
    blocks; full-record frame-local proposals; simulated source truth and paced service deadlines are distinct units.
  comparison: Signed difference versus matched two-frame PCA/ICA and simple spatial controls; six-lag controls remain
    supplementary.
  data_scope: 79 occurrences from 26 Spon identities, 2259 eligible application frames, 51 sparse-positive occurrences
    on 15 right, 108 generated movies, and RTX 4070 SUPER service tests.
