title: Decision after Label Free False Alarm Gated Fusion V5
lifecycle: active
action: stop
rationale: Reject the current gate as a replacement for spatial context; preserve spatial context as the proposal backbone
  and investigate shift-aware null normalization plus explicit identity-level suppression before any new fusion model.
evidence_summary: At the primary nominal target of two false alarms per movie, gated fusion F1 was 0.5441 versus 0.5450 for
  spatial context. Gating raised precision from 0.549 to 0.603 but lowered recall from 0.590 to 0.563 and increased duplicates
  from 0.22 to 0.87 per movie. Its empirical-noise benefit did not offset degradation under nonrigid motion.
