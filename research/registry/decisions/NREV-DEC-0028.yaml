constraints:
- SPU-AUC measures positive-versus-unlabeled ranking, not precision, specificity, calibrated neuron probability,
  or end-to-end proposal recall.
- The grouped global-AUC interval and macro held-fold AUC are distinct summaries and must retain their names.
- The final Run E changes a display bound only; failed partial runs and superseded visual iterations remain preserved.
- The new ranking audit is incomplete and the 78 positive anchors remain part of the same historically examined
  recording.
follow_up:
- Freeze a cluster-resolution comparison before another recording or exhaustively reviewed field is evaluated.
- Use source consistency as quality-control/abstention context; it does not measure independently refitted ICA reproducibility.
