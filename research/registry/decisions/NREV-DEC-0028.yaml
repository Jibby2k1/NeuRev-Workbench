title: Hold Feature Atlas replacement and prioritize competition-aware confirmation
lifecycle: active
action: hold
rationale: Retain this as an exploratory feature-engineering result. Competition-aware, identity-safe proposal resolution
  is the next bounded candidate; the favorable family was selected among four inspected families and requires confirmation.
evidence_summary: On the same 1619-candidate union, augmented linear macro held-fold SPU-AUC was 0.984392 versus
  0.979734 for the retrained existing model, with 35/78 versus 34/78 at budget 58. The paired global SPU-AUC delta
  was +0.004784, but its grouped interval [-0.004081, +0.015125] crossed zero. Nuisance/competition had the strongest
  family point estimate, also with an interval crossing zero. Scientific promotion and the full model-annotation
  audit remain incomplete.
