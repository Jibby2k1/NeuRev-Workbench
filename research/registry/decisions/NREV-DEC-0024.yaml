constraints:
- Preserve NREV-RUN-EXP-0021-SCREEN-20260830-A and its `.partial` tree as failed, immutable, and nonresumable; do not relabel
  it succeeded or use its unserialized model evaluation as result evidence.
- Preserve completed Run B, its frozen runner/config/protocol, and its exact output index; engineering PASS is separate from
  the failed nonlinear advance signal, incomplete scientific audit, and false claim-promotion state.
- Do not tune MLP width, depth, optimizer, seed selection, feature set, folds, review reserve, or favorable subgroups on Run-B
  outcomes and call the result confirmation.
- Keep U candidates unknown rather than negative, quiet candidates source-off controls rather than negatives, and later review
  labels locked and descriptive.
- Treat cfar_score only as same-union scalar reranking and one fusion input; do not describe the favorable MLP-CFAR contrast
  as end-to-end CFAR replacement or nonlinear causal benefit.
- Do not report ordinary precision, specificity, false-positive rate, calibrated neuron probability, causal feature importance,
  independent-recording generalization, biological identity, or scientific completion from this screen.
- Whole-component intervals are descriptive because positive-containing component support is only 9, 3, 3, 2, and 4 across
  folds; stable MLP seeds do not replace independent biological replication.
follow_up:
- Retain linear SPU as the simplest frozen confirmation candidate, with elastic and bagged-PU linear as prespecified sensitivity
  comparators; do not advance the tiny MLP as the default fusion layer.
- Run a separately versioned automated robustness package with the census, features, labels, groups, and model parameters frozen,
  adding leave-one-burst-out, alternate review-policy, hard-subgroup, feature-family ablation, and source-off/null stress analyses.
- If the simple fusion survives those tests, freeze it before evaluation on a compatible independent recording; do not adapt
  it on the transfer recording.
- Complete the required expert, model, comparison, trace, media-validation, and bounded-review audit before any claim-bearing
  evaluation or detector replacement decision.
