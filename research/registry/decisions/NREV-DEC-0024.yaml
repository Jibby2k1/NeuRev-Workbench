title: Hold tiny-MLP replacement and retain simple positive-unlabeled fusion for frozen robustness tests
lifecycle: draft
action: hold
rationale: The tiny MLP substantially exceeded scalar carrier and same-union CFAR reranking, but it did not improve the primary
  estimand over the matched linear SPU model and its whole-component interval crossed zero. Elastic and bagged-PU linear models
  also matched or slightly exceeded the MLP primary point estimate. This pattern supports the richer feature/P-U objective
  as worth testing while providing no evidence that nonlinear interactions justify replacing the simpler fusion layer.
evidence_summary: Run B completed 1,619 OOF candidate scores across 78 positives and 1,541 unknown U candidates. Macro-fold
  SPU-AUC was 0.9740218518 for tiny MLP, 0.9740959140 for linear, 0.9756013670 for elastic, 0.9754961258 for bagged PU,
  0.9501444137 for equal-weight expert fusion, 0.9335176617 for carrier, and 0.7646602748 for same-union CFAR reranking.
  MLP-minus-linear was -0.0000740622 with interval [-0.0046074197, 0.0059124340]; MLP-minus-CFAR was +0.2093615770 with
  interval [0.1207303370, 0.3036814877]. MLP and bagged PU each recovered 34 of 78 at budget 58, versus 33 linear, 30 expert,
  29 carrier, and 14 CFAR. Seed stability and component association passed, but nonlinear advance and the required burst/review-policy
  sensitivity panel did not. Scientific audit and promotion remain incomplete.
effective_on: '2026-08-30'
