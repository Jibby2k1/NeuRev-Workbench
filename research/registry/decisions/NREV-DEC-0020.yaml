constraints:
- This draft does not authorize claim-bearing execution, promotion, or a scientific claim.
- The successful engineering run does not change NREV-EXP-0028 from draft, not_evaluated, and evidence tier none.
- One seed at 500 steps cannot substitute for the registered three seeds at 5000 steps. The unfavorable estimate and screen-level
  threshold violations justify a conservative post-hoc engineering hold, not a formal experiment-level gate failure or a prespecified
  futility stop.
- Run into the registered non-colliding output root and preserve exact code, input, configuration, seed, and environment provenance.
- Complete the applicable scientific audit package before treating computation as audit-complete.
- Keep raw inputs, reviewer identities, private randomization material, credentials, and large generated artifacts outside
  Git.
follow_up:
- Complete NREV-EXP-0025 motion and registration-residual evidence before any claim-bearing representation run.
- Advance uncertainty-aware learning with the frozen interpretable feature stack while JEPA v1 remains on hold.
- Before any future representation run, make the canonical run ID and bootstrap-draw override explicit in the resolved runtime
  record and emit every registered secondary diagnostic.
- Treat any anti-collapse objective, nuisance-residual target, or new score head as a new versioned experiment and run.
- Replace this planning hold only with an evidence-backed decision linked to a validated capsule.
