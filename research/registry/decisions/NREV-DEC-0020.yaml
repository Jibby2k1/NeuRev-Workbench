title: Planning hold for Compact Spatiotemporal JEPA Representation Pilot V1
lifecycle: draft
action: hold
rationale: A bounded non-scientific screen completed successfully as an engineering run and produced an unfavorable primary-gain
  estimate plus screen-level representation-collapse threshold violations. Keep the full experiment on a conservative post-screen
  hold; the incomplete experiment-level gates remain unresolved and claim-bearing execution remains unauthorized.
evidence_summary: Screen B evaluated one of three seeds for 500 of 5000 steps on the full 108-fixture grid. JEPA macro recall
  was 0.01852 versus 0.18750 for the handcrafted comparator, with JEPA-minus-strongest hierarchical 95 percent interval
  [-0.31713, -0.03698]; JEPA also crossed both collapse thresholds at the screen budget. The screen is not a completed scientific
  experiment and does not formally resolve the registered gates.
effective_on: '2026-08-30'
review_state: not_requested
experiment_ids:
- NREV-EXP-0028
claim_ids: []
