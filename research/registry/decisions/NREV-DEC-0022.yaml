constraints:
- Preserve NREV-RUN-EXP-0029-SCREEN-20260830-A and its `.partial` output as a failed, immutable, nonresumable engineering
  run; do not relabel it succeeded or use it as endpoint evidence.
- Preserve the succeeded Run-B output and exact portable `resolved_config.json` and `artifact_index.json`; do not turn its
  engineering completion into a scientific PASS, claim, or evidence capsule.
- The raw-HC anchor remains complete serialized equality across all 108 fixtures and 216 source-on/intervention RecoveryResult
  objects at numeric tolerance zero; coordinate, cardinality, or unmatched-count exceptions remain forbidden.
- Keep native raw HC, normalized JEPA residual, and normalized random-provider residual as distinct endpoint domains; never
  compare their score magnitudes or describe the decoded prediction as identified biological background.
- Native unmatched candidates remain biologically unknown and cannot be counted as verified false positives or specificity.
- The fixture grid, truth centers, proposal cap, calibration API, decoder, checkpoint, caches, seeds, budgets, geometry,
  diagnostics, grouping, and descriptive advancement panel are frozen historical facts of this screen, not permission to
  rerun or widen it in place.
- NREV-EXP-0025 motion evidence, multi-seed confirmation, independent-recording generalization, biological identity evidence,
  and the complete scientific audit remain unresolved.
follow_up:
- Keep native raw HC as the current reference endpoint for this bounded fixture grid and retain NREV-EXP-0029 as draft,
  not evaluated, evidence tier none, and without a capsule.
- Do not escalate the same nonoverlapping tiled one-layer decoder merely by adding steps; the observed background amplification,
  orthogonal distortion, seams, and lower recall require an architectural change and a new versioned protocol.
- If conditional-background learning is revisited, freeze a separate design that directly falsifies patch-boundary and prediction-error
  failure through full-field or overlap-add decoding, matched random controls, and multiple upstream and decoder seeds.
- Resolve the motion dependency and complete the required full-field, close-up, trace, matched-figure, decode-validation,
  and independent-recording audit before any claim-bearing experiment is considered.
