title: Post-screen hold for the Frozen-JEPA conditional-background residual v1.1 design
lifecycle: draft
action: hold
rationale: Run A correctly stopped on an exact parent-anchor mismatch before any conditional-residual endpoint was interpreted,
  and the schema-2 v1.1 correction restored exact native-unit continuity without relaxing that guard. Run B then completed
  the bounded engineering screen, but native raw HC had the strongest recall point estimate while the JEPA residual amplified
  registered background and seam diagnostics. Keep this exact tiled one-layer conditional-residual design on hold; the screen
  is not a formal scientific gate and does not resolve the broader conditional-background-learning hypothesis.
evidence_summary: Run A's safe failure was traced to normalized input being supplied to a native-unit raw-HC endpoint; native-unit
  reconstruction reproduced all 216 parent RecoveryResults exactly. Run B passed the 108-fixture and 216-object raw anchor,
  all 240 prediction-coverage rows, both algebraic closures, and the 27-artifact index. Across 252 sources, macro recall was
  0.1875 raw, 0.09027777777777778 JEPA residual, and 0.06712962962962964 random residual. JEPA minus raw was -0.09722222222222222
  with grouped 95 percent interval [-0.24305555555555552, 0.027835648148148106]; JEPA minus random was 0.023148148148148154
  with interval [-0.043981481481481476, 0.09722222222222227]. Median JEPA aligned retention was 0.9990785812365571, but
  background RMS ratio was 1.7102741349511534, dynamic-MAD ratio 1.1093322124630185, and seam-to-interior jump ratio 2.5786383127702.
  The scientific audit, motion dependency, multi-seed stability, independent-recording generalization, and biological identity
  evidence remain unresolved.
effective_on: '2026-08-30'
review_state: not_requested
