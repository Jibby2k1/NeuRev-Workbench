claim_ids: []
evidence_capsule_ids: []
constraints:
- This separate Gamma-LS program does not update the 106-occurrence identity-safe flagship claim ledger or its independent-generalization
  gate.
- The protected burst-occupancy, independent block-ranking, and operational frame-level proposal heads are different
  estimands.
- h15 is operational, not sufficient or optimal; 371 proposal rows are not unique neurons, events, or confirmed
  detections.
- One independent sparse-positive recording does not establish population generalization or biological precision,
  specificity, false-positive rate, or identity.
- Batch throughput does not establish zero-miss/zero-drop sustained 1-kHz readiness.
follow_up:
- Use the September 9 result report and distinct Gamma-LS paper outline as the manuscript authority.
- Keep the six-lag low-burden finding supplementary until a separate confirmation passes its full gate.
