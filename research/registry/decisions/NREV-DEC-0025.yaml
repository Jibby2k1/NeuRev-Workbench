program_id: NREV-PRG-0005
title: Retain the fixed signed-difference Gamma-LS context with failed scientific gates explicit
lifecycle: active
action: retain
rationale: Document the single-scale signed-difference architecture as the operational result, preserving the distinction
  between passed artifact/audit checks and unsuccessful support, representation, superiority, and sustained-timing
  decisions.
evidence_summary: The h15 context won all four coordinate-free training folds but failed protected support sufficiency.
  Two-frame ICA did not pass its paired gain gate; radial superiority was not established. The q1 full-record ledger
  contains 371 frame-local proposals on 295 of 2259 frames. Its final model-only audit passed with 24 label-free
  surrogates, 25 decoded videos, 27 PNGs, no annotation source opened, and manual visual QA. The independent 15
  right B58-per-block result was 6/51. Corrected batch throughput was 1470 to 2216 frames/s, while both strict 1-kHz
  paced trials failed.
effective_on: '2026-09-09'
