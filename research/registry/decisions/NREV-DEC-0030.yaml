program_id: NREV-PRG-0001
title: Hold contextual attenuation for peak retrieval and retain morphology diagnostics
lifecycle: active
action: hold
rationale: The peak-rank estimand selects maxima where U equals A, so temporal H equals A there. Retain temporal
  attenuation for trace-morphology diagnosis and do not advance the spatial arm for known-center retrieval.
evidence_summary: All 106 occurrences at 50 sites produced 2226 occurrence-feature rows and 106 trace comparisons.
  No aligned attenuation arm passed the gate against both A-squared and its matched misalignment control. Temporal
  peak localization nearly tied the amplitude control; the 3-by-3 spatial envelope reduced localization. The run
  report records validation passed and scientific promotion false.
