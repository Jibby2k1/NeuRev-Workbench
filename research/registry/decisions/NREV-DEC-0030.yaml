constraints:
- This is within-recording operator retrieval; no biological negatives, full-field precision, specificity, identity,
  or transfer were established.
- The existing registry retains its draft/evidence-none status until normalized run and audit provenance is reconciled;
  this decision makes the completed report visible without promotion.
follow_up:
- Use the full-trace morphology experiment EXP-0033 for event-area, shoulder, and duration questions.
