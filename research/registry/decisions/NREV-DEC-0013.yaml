title: Decision after Automated Challenge Suite V7
lifecycle: active
action: retain
rationale: Preserve robust null normalization as a candidate improvement, reject current BH stopping and post-proposal suppression
  as solved components, make identity-aware close-source resolution and parameter-robust stopping the next automated development
  targets, and redesign kinetic falsification around directional kernels.
evidence_summary: Movie-wise robust null normalization improved mean F1 from 0.505 to 0.523; OOD signatures separated the
  deliberately shifted challenges with AUC 1.0; and a second simulator passed the F1 gate. Conversely, BH stopping produced
  F1 0.299, suppression variants were equivalent, weak-neighbor 80-percent recovery required amplitude ratio 1.0 at 3 to 7
  px, colored noise reduced top-eight recall from 0.833 to 0.708, stability F1 ranged from 0 to 0.5, and reversed-time kinetic
  AUC remained 0.731.
