constraints:
- Register only canonical Motion Run E and predictor-feasibility Run B; motion A through D, predictor A, and superseded rank
  diagnostics remain provisional unregistered engineering history.
- Do not use the Run-E crop-global/local-window translation-like estimates as motion fields, regressors, measured biological
  motion, or evidence that motion is absent; all 12 failed reliability review.
- Do not treat source-off windows as neuron-free, signal-free, pure background, or noise-only; native candidates and biological
  activity remain unknown rather than negative.
- Rank-F categories are operational paired top-four recovery patterns only and do not identify a competitor, attenuation,
  causal response failure, false positive, artifact, or biological source.
- The source-off residual guardrail is retrospective and its all-raw output establishes exact fallback identity only, not
  prospective safety, denoising, or residual benefit.
- EXP-0030 evaluation panels applied the predeclared eligibility gate but did not fit, tune, or pre-gate-select the candidate
  panel, hyperparameters, checkpoints, thresholds, or a favorable reported subset; zero of seven subtractors was eligible.
- Do not launch another residual-detector screen from these seven subtractors or expand the current tiled decoder in place
  with more seeds, steps, depth, thresholds, or favorable subgroups.
- Scientific-audit media, reliable motion/acquisition support, multi-seed evidence, independent-recording support, and biological
  identity remain incomplete; no claim, evidence capsule, precision, denoising, causality, or generalization statement is authorized.
follow_up:
- Preserve native raw HC as the automatic reference and deterministic fallback for the exact bounded fixture grid.
- If motion adjustment is revisited, create a new estimator or acquisition-metadata contract with disjoint reliability validation
  before joining any nuisance field to endpoint outcomes.
- If conditional prediction is revisited, define a new predictor objective and seam-safe full-field or overlap-add interface,
  freeze it on disjoint source-off development data, and require source preservation before any detector endpoint.
- >-
  Prioritize automated packages with a better-defined decision target: full-field acquisition normalization, grouped
  positive-unlabeled learning with provisional-label sensitivity, an unlabeled proposal census with surrogate-null controls,
  and evidence-sufficiency simulation that preserves site and neighborhood clustering.
- Complete the missing full-field, close-up, full-duration trace, matched-figure, decode-validation, multi-seed, and independent-recording
  audit before considering a claim-bearing experiment.
