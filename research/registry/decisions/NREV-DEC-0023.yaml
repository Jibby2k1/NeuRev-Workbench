program_id: NREV-PRG-0001
title: Hold the current motion-conditioned residual path after bounded automated sentinels
lifecycle: draft
action: hold
rationale: The current automated chain has now exercised three bounded engineering questions without producing an eligible
  motion nuisance field, residual endpoint, or source-off subtractor. Motion Run E repaired matched-support accounting but
  every local window required reliability review and no grouped association survived multiplicity correction. EXP-0029
  Run B had lower JEPA-residual recovery than raw scoring while registered background, dynamic, seam, and orthogonal diagnostics
  were larger; its exact Rank-F recovery patterns and retrospective source-off guardrail do not establish a cause or prospective
  safety. EXP-0030 Run B admitted zero of seven subtractors through its fixed 11-check eligibility gate. Hold this implementation
  path rather than widening it with more seeds, steps, depth, or another detector. This action is design triage, not rejection
  of motion modeling, conditional prediction, JEPA, or background subtraction as general research directions.
evidence_summary: EXP-0025 Run E completed 372 adjacent-pair calculations with exact matched support, but all 12 windows required
  review, median registered/raw difference-MAD ratio was 0.9520895725611223, and 0 of 14 association rows passed BH. EXP-0029
  Run B reproduced all 216 raw-HC parent RecoveryResults and had macro source-on recall 0.1875 raw, 0.09027777777777778 JEPA
  residual, and 0.06712962962962964 matched random residual. Provenance-complete Rank F reproduced all 324 method-fixture
  recovery objects and described JEPA source-on misses as 114 intervention-recovered/source-on-not-one-to-one-recovered and
  119 both-maps-missed occurrences; those are operational patterns with unknown candidate identity. The post-screen safety
  policy admitted 0 of 12 windows per residual arm and deterministically fell back to raw for all 108 fixtures. EXP-0030 Run
  B completed seven subtractors plus an identity reference; zero subtractors passed all 11 fixed checks and low-rank AR(1),
  the closest subtractor, passed 5 of 11. Every experiment remains draft, not evaluated, evidence tier none, and without a claim
  or capsule.
