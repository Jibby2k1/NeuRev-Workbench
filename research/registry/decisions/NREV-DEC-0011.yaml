title: Decision after Generator Family Holdout V4
lifecycle: active
action: retain
rationale: Treat spatial context as the robust proposal backbone; test a frozen gated fusion learned only on simulator-development
  families, and replace truth-scaled proposal budgets with label-free score or false-alarm controls before biological transfer.
evidence_summary: Spatial context achieved the best mean operating F1 at 0.515, recall at 0.773, localization at 1.202 px,
  and duplicate rate at 0.083 per movie. It also led leave-one-family-out average precision at 0.824. Combined retained the
  best mean Brier score at 0.094 and balanced accuracy at 0.722, but compound-shift F1 fell to 0.319 versus 0.338 for spatial
  context.
