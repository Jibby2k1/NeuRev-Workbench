action: stop
rationale: Retain single-window robust stopping; reject unconstrained NMF and simple directional subtraction; pursue joint
  spatial-temporal generative deblending and source-specific kinetic likelihood ratios only with new development conditions.
evidence_summary: Consensus and single-window stopping were identical at F1 0.568 and radius sensitivity 0.0417. Rank-two
  NMF reduced weak-identity recovery from 0.354 to 0.069 and mean F1 from 0.580 to 0.354. Directional contrast reduced reversed
  AUC to 0.523 but also reduced forward AUC to 0.477, failing useful directionality. Only one of five gates passed.
