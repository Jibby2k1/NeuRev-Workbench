rationale: Retain CS-Parzen and stop the matrix-TC extension as specified in the completed report; a positive interval
  does not override the failed locked minimum-effect criterion.
evidence_summary: Across 80 development pairs, matrix-TC minus CS-Parzen mean held-out absolute source correlation
  was +0.00193 with interval [-0.01120, +0.01287]. Locked specialized confirmation produced +0.019481 across 40
  primary pairs, 35/40 wins, and seed-cluster interval [+0.011270, +0.029030]. The sparse-calcium guardrail passed
  at -0.002331, but the primary mean missed the predeclared +0.020 threshold by 0.000519.
