hypotheses:
  - id: ICA_T1
    question: Does temporal two-frame ICA add an operation beyond signed difference?
    metric: equivalence_to_signed_difference
    current_result: r_squared_0.9938_no_independent_operation
  - id: ICA_S1
    question: Does spatial ICA improve reviewer boundary visibility over Raw alone?
    primary_outcomes: [boundary_resolvable, neuron_shape_resolvable, reviewer_confidence]
    design: blinded_within_observation_raw_vs_ica_vs_combined
    status: pending_panel_specific_review
  - id: ICA_S2
    question: Are spatial ICA footprints compact and localized relative to matched annular and translated controls?
    primary_outcomes: [center_surround_contrast, compactness, footprint_radius, translated_control_delta]
    design: frozen_spatial_ica_no_label_refit
    status: ready_to_run
  - id: ICA_S3
    question: Does spatial ICA help difficult morphology strata without losing event timing?
    strata: [localized_center, membrane_or_ring, overlapping, weak_signal, no_boundary]
    primary_outcomes: [known_positive_recall, boundary_resolvable, peak_frame_error, peak_retention, area_retention]
    status: ready_to_run
  - id: ICA_N1
    question: Does ICA carry stable cross-neural coactivity information?
    status: exploratory_supported
  - id: ICA_F1
    question: Are individual ICA tensor factors stable enough to interpret?
    stability_threshold: 0.8
    current_result: failed_component_stability
gates:
  provenance:
    require_exact_displayed_panel_for_each_review: true
    original_hard_roi_clip_panels: [raw_intensity, fixed_pseudocolor, positive_temporal_change]
    do_not_relabel_positive_change_as_ica: true
  morphology_promotion:
    require_blinded_raw_ica_combined_ablation: true
    require_site_blocked_uncertainty: true
    require_morphology_stratum_reporting: true
    require_matched_spatial_controls: true
  interpretation:
    visual_utility_does_not_require_native_signal_fidelity: true
    visual_utility_does_not_establish_anatomical_identity: true
    unmatched_candidates_remain_unknown: true
