site_name: NeuRev Workbench
site_description: >-
  Evidence-first calcium-imaging measurement, detection, review, and research
  provenance.
site_author: NeuRev Workbench contributors
site_url: https://jibby2k1.github.io/NeuRev-Workbench/
repo_name: Jibby2k1/NeuRev-Workbench
repo_url: https://github.com/Jibby2k1/NeuRev-Workbench
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

# Historical plans and binary manuscript artifacts remain available in Git,
# but are intentionally kept out of the searchable, current documentation set.
exclude_docs: |
  /README.md
  /CODEBASE_AUDIT.md
  /plan.md
  archive/plans/
  **/*.docx
  **/*.pdf
  **/*.zip

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/brain
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/brand/palette.css
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Jibby2k1/NeuRev-Workbench
      name: NeuRev Workbench on GitHub

copyright: >-
  NeuRev Workbench contributors · Evidence state and scientific outcome are
  recorded independently.

# Existing research notes include repository-root links that MkDocs cannot
# resolve from docs_dir. New site pages use full GitHub URLs for those targets.
# Keep the legacy diagnostics visible without turning them into strict-build
# failures; navigation itself remains fail-closed.
validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: warn
    anchors: warn

